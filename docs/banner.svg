<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Painel da Casa: controle financeiro a dois, direto no desktop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151a3d"/>
      <stop offset="1" stop-color="#0d2a3a"/>
    </linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <circle cx="180" cy="40" r="170" fill="#6d4aff" opacity="0.45" filter="url(#blur)"/>
    <circle cx="1060" cy="300" r="190" fill="#06b6d4" opacity="0.38" filter="url(#blur)"/>
    <circle cx="700" cy="-20" r="120" fill="#ec4899" opacity="0.18" filter="url(#blur)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- anel decorativo, no estilo do painel -->
    <g transform="translate(1010 170)">
      <circle r="92" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="22"/>
      <circle r="92" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round" stroke-dasharray="380 600" transform="rotate(-90)"/>
      <circle r="58" fill="#ffffff" fill-opacity="0.04"/>
      <text y="-4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#cbd5e1">AINDA CABE</text>
      <text y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">R$ 1.619</text>
    </g>

    <text x="70" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" fill="url(#tx)">Painel da Casa</text>
    <text x="74" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#e2e8f0">Controle financeiro a dois, direto no desktop.</text>
    <text x="74" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">Gastos, recebimentos, parcelas e uma planilha Excel sempre atualizada.</text>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">
      <rect x="74" y="272" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="128" y="294" text-anchor="middle">Electron</text>
      <rect x="194" y="272" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="248" y="294" text-anchor="middle">Node.js</text>
      <rect x="314" y="272" width="122" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="375" y="294" text-anchor="middle">JavaScript</text>
      <rect x="448" y="272" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="502" y="294" text-anchor="middle">Excel .xlsx</text>
      <rect x="568" y="272" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="622" y="294" text-anchor="middle">100% offline</text>
    </g>
  </g>
</svg>
